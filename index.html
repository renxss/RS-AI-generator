<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css">
    <title>Ai Poem Generator</title>
</head>
<body>
  <div class="container">
    <header><h1> AI French Poem Generator</h1></header>

    <main>
        <div id="form-container">
        
        <form>
            <input 
             type = "text" 
             placeholder="Enter a topic.."
             autofocus
             required
             autocomplete="off"
             class="instructions"
             id="user-instruction"
              
            />
            <input type="submit" class="submit-button"/>
             
        </form>
        <div class="hint">i.e: Flowers💐, Paris🗼 or Cheese🧀 </div>
        </div>
        <div class="poem hidden" id="poem"></div>
    </main>
    
    <script src="src/index.js"></script>
    
    <footer> This AI project was coded by Renee Singh and is <a href="https://github.com/renxss/RS-AI-generator" target="_blank">open-sourced on Github</a> and is hosted on <a href="https://rs-ai-generator.netlify.app/" target="_blank">Netlify</a></footer>
  </div>
 
</body>
</html>
